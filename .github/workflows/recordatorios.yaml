name: Recordatorios diarios

on:
  schedule:
    - cron: '7 13 * * *'   # todos los días 13:07 UTC = 8:07 a. m. hora Colombia
  workflow_dispatch:         # botón "Run workflow" para ejecutarlo a mano
    inputs:
      prueba:
        description: 'Enviar una notificación de prueba a todos los dispositivos'
        type: boolean
        default: false

permissions:
  contents: write   # solo para el paso que mantiene activo el repositorio

concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Enviar recordatorios
        run: node scripts/enviar-recordatorios.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACTO: ${{ secrets.VAPID_CONTACTO }}
          PRUEBA: ${{ inputs.prueba && '1' || '' }}

      # GitHub apaga las tareas programadas de repositorios públicos tras 60 días sin cambios.
      # Si el último cambio tiene 45 días o más, se hace un commit vacío para mantenerla activa.
      - name: Mantener activo el repositorio
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct)
          dias=$(( ( $(date +%s) - ultimo ) / 86400 ))
          echo "Días desde el último cambio: $dias"
          if [ "$dias" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantener activos los recordatorios automáticos"
            git push
          fi